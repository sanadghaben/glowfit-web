<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سياسة الخصوصية | GlowFit AI</title>
<meta name="description" content="سياسة الخصوصية الخاصة بتطبيق GlowFit AI">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --pink: #FF6B9D;
        --purple: #C44FE2;
        --dark: #0A0A1A;
        --darker: #060612;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: 'Noto Kufi Arabic', 'Inter', sans-serif;
        background: var(--darker);
        color: rgba(255,255,255,0.85);
        line-height: 1.9;
        min-height: 100vh;
    }
    .container { max-width: 780px; margin: 0 auto; padding: 60px 24px 100px; }
    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: rgba(255,255,255,0.5);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 40px;
        transition: color 0.2s;
    }
    .back-link:hover { color: var(--pink); }
    h1 {
        font-size: 32px;
        font-weight: 800;
        background: linear-gradient(135deg, var(--pink), var(--purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 30px;
    }
    #policy-content {
        white-space: pre-wrap;
        font-size: 15px;
        color: rgba(255,255,255,0.75);
    }
    .loading {
        color: rgba(255,255,255,0.3);
        font-size: 14px;
    }
    footer {
        text-align: center;
        padding: 30px;
        color: rgba(255,255,255,0.2);
        font-size: 12px;
    }
</style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">→ الرجوع للرئيسية</a>
    <h1>سياسة الخصوصية</h1>
    <div id="policy-content" class="loading">جاري تحميل المحتوى...</div>
</div>

<footer>© 2025 GlowFit AI by Veltratech LTD. جميع الحقوق محفوظة.</footer>

<script>
(function () {
    // نفس بيانات الربط المستخدمة بصفحة الهبوط الرئيسية
    const SUPABASE_URL = 'https://ojaxkhkbyfkcwgavxihq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qYXhraGtieWZrY3dnYXZ4aWhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NTIxNjQsImV4cCI6MjA5MzIyODE2NH0.g5fsf1h9nQ1E3XpBCKMIVkVb7lMCp0uUc5SLUEdNZpM';

    const contentEl = document.getElementById('policy-content');

    fetch(`${SUPABASE_URL}/rest/v1/site_content?select=content&key=eq.privacy_policy`, {
        headers: { 'apikey': SUPABASE_ANON_KEY }
    })
        .then(res => res.json())
        .then(rows => {
            if (rows && rows[0] && rows[0].content) {
                contentEl.textContent = rows[0].content;
                contentEl.classList.remove('loading');
            } else {
                contentEl.textContent = 'سياسة الخصوصية غير متوفرة حالياً. للاستفسار تواصل معنا.';
            }
        })
        .catch(() => {
            contentEl.textContent = 'تعذّر تحميل سياسة الخصوصية حالياً. حاول تحديث الصفحة لاحقاً.';
        });
})();
</script>

</body>
</html>
