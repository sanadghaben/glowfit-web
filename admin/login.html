<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - GlowFit Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Tajawal',sans-serif;
    background:#1a1a2e;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    position:relative;
    overflow:hidden;
}
body::before{
    content:'';
    position:absolute;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(147,51,234,0.25), transparent 70%);
    top:-200px; right:-200px;
    border-radius:50%;
}
body::after{
    content:'';
    position:absolute;
    width:500px;height:500px;
    background:radial-gradient(circle, rgba(236,72,153,0.2), transparent 70%);
    bottom:-150px; left:-150px;
    border-radius:50%;
}
.login-card{
    background:#fff;
    border-radius:28px;
    padding:45px 40px;
    width:100%;
    max-width:400px;
    box-shadow:0 25px 60px rgba(0,0,0,0.3);
    position:relative;
    z-index:1;
}
.logo{
    font-size:26px;
    font-weight:900;
    background:linear-gradient(135deg,#a855f7,#ec4899);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-align:center;
    margin-bottom:8px;
}
.subtitle{
    text-align:center;
    font-size:13px;
    color:rgba(0,0,0,0.4);
    font-weight:500;
    margin-bottom:35px;
}
.field{margin-bottom:18px}
.field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
    color:#1a1a2e;
}
.field input{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid #e2e8f0;
    background:#f8fafc;
    font-family:'Tajawal';
    font-size:14px;
    outline:none;
    transition:all 0.3s;
}
.field input:focus{
    border-color:#9333ea;
    background:#fff;
    box-shadow:0 0 0 4px rgba(147,51,234,0.08);
}
.submit-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#9333ea,#ec4899);
    color:#fff;
    font-family:'Tajawal';
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    margin-top:10px;
    transition:all 0.3s;
}
.submit-btn:hover{transform:translateY(-2px); box-shadow:0 10px 25px rgba(147,51,234,0.3)}
.submit-btn:disabled{opacity:0.6; cursor:not-allowed; transform:none}
.error-msg{
    background:#fef2f2;
    color:#ef4444;
    padding:12px 16px;
    border-radius:12px;
    font-size:13px;
    font-weight:600;
    margin-bottom:18px;
    display:none;
}
.error-msg.show{display:block}
</style>
</head>
<body>

<div class="login-card">
    <div class="logo">GlowFit Admin</div>
    <div class="subtitle">سجّل دخولك لإدارة لوحة التحكم</div>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form">
        <div class="field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="admin@glowfit.ai" required autocomplete="username">
        </div>
        <div class="field">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="submit-btn" id="submit-btn">تسجيل الدخول</button>
    </form>
</div>

<script src="./js/api.js"></script>
<script>
    const GlowFitAPI = window.GlowFitAPI;
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    // لو المستخدم مسجل دخول أصلاً، وديه على اللوحة الرئيسية مباشرة
    if (GlowFitAPI.isLoggedIn()) {
        window.location.href = 'Main_Overview.html';
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.classList.remove('show');
        submitBtn.disabled = true;
        submitBtn.innerText = 'جاري الدخول...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            await GlowFitAPI.signIn(email, password);
            await GlowFitAPI.verifyStaffAccess();
            window.location.href = 'Main_Overview.html';
        } catch (err) {
            errorMsg.innerText = err.message && err.message.includes('مخوّل')
                ? err.message
                : 'بيانات الدخول غير صحيحة، حاول مرة أخرى';
            errorMsg.classList.add('show');
            submitBtn.disabled = false;
            submitBtn.innerText = 'تسجيل الدخول';
        }
    });
</script>

</body>
</html>
